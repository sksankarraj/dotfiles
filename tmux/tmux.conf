# Base configurations
bind -n M-H previous-window
bind -n M-L next-window
unbind C-b
set -g prefix C-Space
bind C-space send-prefix
set -g mouse off
setw -g mode-keys vi
set -g allow-rename off

set-hook -g pane-focus-in 'select-pane -T "#{pane_current_command}"'

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'catppuccin/tmux'
# set -g @plugin 'egel/tmux-gruvbox'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-sessionist'
set -g @plugin 'laktak/extrakto'
set -g @plugin 'tmux-plugins/tmux-cpu'

# Gruvbox theme configurations
# set -g @tmux-gruvbox 'dark'
set -g @catppuccin_flavor 'mocha'
# keybindings
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# SPLIT
bind h split-window -v
bind v split-window -h
bind f set status

unbind '"'
unbind %

# status panes
set -g @catppuccin_status "on"
set -g @catppuccin_window_status_style "rounded"
# set -g @catppuccin_status_modules_right "cpu ram directory session"
# set -g @catppuccin_status_modules_left "application"
set -g @catppuccin_status_modules_right "cpu ram battery date_time"
# set -g status-right 'CPU: #{cpu_percentage} | RAM: #{ram_percentage} | %H:%M '

# set -g status-right '#{cpu_bg_color} CPU: #{cpu_icon} #{cpu_percentage} | %a %h-%d %H:%M '
set-option -g status-position top

run '~/.config/tmux/plugins/tpm/tpm'
